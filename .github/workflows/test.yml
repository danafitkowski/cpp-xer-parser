name: test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run unit tests (pytest)
        run: pytest tests/ -v

      - name: Run unit tests (direct, no pytest)
        shell: bash
        run: |
          python tests/test_xer_parser.py
          python tests/test_half_step.py
          python tests/test_bundled_validation_runs.py
          python tests/test_report_summary_2026_09_29.py
          python tests/test_calendar_shift_hours_2026_10_10.py
          python tests/test_p6_rules_2026_10_13.py
          python tests/test_corrupt_calendar_record_2026_10_28.py

  package:
    name: Build, install and use the package (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest the classifiers name.
        python: ['3.10', '3.15']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install the wheel in a clean environment and use it
        shell: bash
        run: |
          python -m venv /tmp/pkg
          /tmp/pkg/bin/pip install dist/*.whl
          cd /tmp
          /tmp/pkg/bin/python -c "import cpp_xer_parser as p, cpp_xer_parser.xer_parser as x; assert x._VALIDATION_AVAILABLE; assert x.get_profile.__module__ == 'cpp_xer_parser.config_profiles'; print('cpp_xer_parser', p.__version__)"
          /tmp/pkg/bin/cpp-xer-parser > usage.txt || test $? -eq 1
          grep -q "parse" usage.txt
          /tmp/pkg/bin/python "$GITHUB_WORKSPACE/.github/smoke_installed.py"
